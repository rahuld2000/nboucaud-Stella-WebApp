<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex, nofollow" />
        <meta name="referrer" content="no-referrer" />

        <title>Infogito</title>

        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="application-name" content="Infogito" />
        <meta name="format-detection" content="telephone=no" />

        <link
            rel="icon"
            type="image/jpeg"
            href="/static/images/favicon/favicon.jpeg"
            sizes="16x16"
        />

        <!-- We need this CSS first to show the initial loading screen -->
        <link
            id="initialLoadingScreenCSS"
            rel="stylesheet"
            href="/static/css/initial_loading_screen.css"
        />
    </head>
    <body class="font--open_sans enable-animations">
        <%=
        require('html-loader!./components/initial_loading_screen/initial_loading_screen_template.html').default
        %>
        <div id="root"></div>
        <div id="root-portal"></div>
        <%=
        require('html-loader!./components/no_script/no_script_template.html').default
        %>
    </body>
</html>
